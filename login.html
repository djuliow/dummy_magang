<!-- Login Container -->
<main class="relative z-10 flex min-h-screen items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-auto max-w-[480px]">
<!-- Login Card -->
<div class="glass-card rounded-xl p-md md:p-lg flex flex-col gap-md transition-all duration-300">
<!-- Brand Identity -->

<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">eco</span>

</div>
<p class="font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Precision Farming</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-md mt-sm" onsubmit="event.preventDefault();"><div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="role">Select Role</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant">badge</span>
<select class="w-full pl-[48px] pr-sm py-sm rounded-lg bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none font-body-md appearance-none cursor-pointer" id="role">
<option value="admin">Admin</option>
<option value="manajer">Manajer</option>
<option value="mandor">Mandor</option>
<option value="pekerja">Pekerja</option>
</select>
<span class="material-symbols-outlined absolute right-sm text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant">mail</span>
<input class="w-full pl-[48px] pr-sm py-sm rounded-lg bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none font-body-md" id="email" placeholder="manager@farm.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant">lock</span>
<input class="w-full pl-[48px] pr-sm py-sm rounded-lg bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none font-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-sm text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>

<div class="relative flex items-center">

<div class="w-5 h-5 border-2 border-outline-variant rounded peer-checked:bg-primary peer-checked:border-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[16px] hidden peer-checked:block">check</span>
</div>
</div>

</label>

</div>

<!-- Interactive Micro-interactions -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Add a subtle parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-card');
            if (card) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                card.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
            }
        });
    </script>
